[build-system]
requires = [ "setuptools>=68",]
build-backend = "setuptools.build_meta"

[project]
name = "pip-vm"
version = "1.0.0"
description = "Like pipx, but each installed program runs in a throwaway virtual machine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [ "ziglang",]

[project.scripts]
pip-vm = "pipvm.cli:main"
pipvm = "pipvm.cli:main"
xephyr-run = "pipvm.xephyr_run.cli:main"

[tool.setuptools.package-data]
"pipvm.xephyr_run" = [ "*.c",]

[tool.setuptools.packages.find]
include = [ "pipvm*",]
